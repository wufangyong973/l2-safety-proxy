name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit + integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: policy:check (example poison + clean fixture)
        run: npm run policy:check

      - name: Offline dual-layer demo
        run: npm run demo:dual-layer

      - name: Agent halt sample
        run: node examples/agent-viem-halt.mjs

      - name: Offline Layer 1 abort + fail-open demo
        run: npm run demo:offline
